    post:
      operationId: setupAdminMfa
      tags: [adminMfa]
      summary: Start authenticator enrollment — returns the TOTP secret and otpauth URI (admin role only)
      description: >-
        Never overwrites an already-enabled enrollment (409). Re-running
        while enrollment is still pending issues a fresh secret.
      responses:
        "200":
          description: Provisioning material for the authenticator app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMfaSetupResponse"
        "409":
          description: Already enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin-mfa/verify:
    post:
      operationId: verifyAdminMfa
      tags: [adminMfa]
      summary: Confirm an authenticator code (or backup code) and receive an admin unlock token (admin role only)
      description: >-
        The first successful verification activates the enrollment and
        returns the one-time backup codes. Every success returns a signed
        unlock token to send as the X-Admin-Mfa header on admin requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMfaVerifyInput"
      responses:
        "200":
          description: Unlock token (plus backup codes on first activation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMfaVerifyResponse"
        "400":
          description: Code didn't match, or enrollment hasn't been set up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/content-reports:
    get:
      operationId: adminListContentReports
      tags: [admin]
      summary: Community report queue, ordered by triage priority (admin only)
      description: >-
        User-filed reports against Debate Now content, ordered critical →
        high → medium → low and oldest-first within a priority. The
        openByPriority summary always reflects the full unresolved queue
        regardless of the current filter.
      parameters:
        - in: query
          name: status
          schema:
            type: string
          required: false
          description: "'unresolved' (default: open + in_review), 'open', 'in_review', 'resolved', or 'all'."
        - in: query
          name: priority
          schema:
            type: string
          required: false
          description: "Filter to one of 'critical' | 'high' | 'medium' | 'low'."
        - in: query
          name: reason
          schema:
            type: string
          required: false
        - in: query
          name: page
          schema:
            type: integer
          required: false
        - in: query
          name: pageSize
          schema:
            type: integer
          required: false
      responses:
        "200":
          description: Reports page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentReportListResponse"

