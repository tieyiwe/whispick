        countryCode:
          type: ["string", "null"]
          description: ISO 3166-1 alpha-2, self-reported — captured from the country picker at phone-verification time (see users.countryCode), or set directly via PATCH /user/profile. Null until either happens.
        gender:
          type: ["string", "null"]
          description: "'woman' | 'man' | 'nonbinary' | 'prefer_not_to_say' | null (not yet answered)"
        ageRange:
          type: ["string", "null"]
          description: "'13-17' | '18-24' | '25-34' | '35-44' | '45-54' | '55-64' | '65+' | 'prefer_not_to_say' | null (not yet answered)"
        preferredLanguage:
          type: ["string", "null"]
          description: >-
            ISO 639-1 code from lib/languages.ts's SUPPORTED_LANGUAGES ('en'
            | 'fr' | 'ar' | 'de' | 'es' | 'pt' | 'zh' | 'ja' | 'hi' | 'ru' |
            'id' | 'bn' | 'sw' | 'ko'), or null (not yet answered). What the
            app renders in, and what server-generated text (notifications,
            emails) is sent in — see users.preferredLanguage.
        whispererHandle:
          type: ["string", "null"]
          description: This account's persistent, public, followable Debate Topics handle — see users.whispererHandle. Null until first assigned (posting a topic, or commenting while signed in).
