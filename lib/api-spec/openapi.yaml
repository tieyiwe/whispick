          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group send detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupWhispSendDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /whisper-groups/{id}:
    get:
