openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Blind Whisper API — anonymous video recommendation platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: whisps
    description: Whisp management
  - name: video
    description: Video metadata
  - name: public
    description: Public recipient endpoints
  - name: user
    description: User profile
  - name: credits
    description: Credit & plan management
  - name: billing
    description: Stripe checkout
  - name: circles
    description: Private invite-only circles
  - name: admin
    description: App-owner admin panel — user/content management and analytics
  - name: whisperGroups
    description: Saved contact groups for sending one whisp to several people at once, anonymously
  - name: suggestions
    description: Admin-curated + AI-discovered Suggestions Library
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /whisps:
    get:
      operationId: listWhisps
      tags: [whisps]
      summary: List all whisps sent by the current user
      parameters:
        - in: query
          name: status
          schema:
            type: string
          required: false
      responses:
        "200":
          description: List of whisps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Whisp"
    post:
      operationId: createWhisp
      tags: [whisps]
      summary: Send a new whisp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhispInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whisp"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /whisps/stats:
    get:
      operationId: getWhispStats
      tags: [whisps]
      summary: Dashboard stats for the current user
      responses:
        "200":
          description: Aggregated stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhispStats"

  /whisps/{id}:
    get:
      operationId: getWhisp
      tags: [whisps]
      summary: Get a single whisp with tracking timeline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Whisp detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhispDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteWhisp
      tags: [whisps]
      summary: Delete a whisp
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /whisps/{id}/replies:
    get:
      operationId: listWhispReplies
      tags: [whisps]
      summary: Get anonymous replies for a whisp
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Replies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhispReply"
    post:
      operationId: createWhispReply
      tags: [whisps]
      summary: Send an anonymous reply (from recipient or sender follow-up)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhispReplyInput"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhispReply"

  /whisps/{id}/reveal:
    post:
      operationId: requestReveal
      tags: [whisps]
      summary: Sender requests to reveal identity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reveal requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whisp"
    patch:
      operationId: respondReveal
      tags: [whisps]
      summary: Recipient responds to reveal request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealResponse"
      responses:
        "200":
          description: Reveal response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealResult"
        "400":
          description: No reveal was requested for this whisp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /video/meta:
    post:
      operationId: scrapeVideoMeta
      tags: [video]
      summary: Scrape video metadata from a URL (YouTube, TikTok, Instagram, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoMetaRequest"
      responses:
        "200":
          description: Video metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoMeta"
        "400":
          description: Could not scrape URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Video is private, restricted, or no longer exists — the recipient wouldn't be able to open it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/w/{token}:
    get:
      operationId: getPublicWhisp
      tags: [public]
      summary: Public recipient landing page data (no auth required)
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public whisp data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWhisp"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/w/{token}/track:
    post:
      operationId: trackWhispEvent
      tags: [public]
      summary: Record a tracking event (opened, clicked, watched)
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingEventInput"
      responses:
        "200":
          description: Tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResult"

  /public/w/{token}/reply:
    post:
      operationId: publicReply
      tags: [public]
      summary: Recipient sends an anonymous reply from the landing page
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicReplyInput"
      responses:
        "201":
          description: Reply sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhispReply"

  /public/w/{token}/appreciation:
    post:
      operationId: submitAppreciation
      tags: [public]
      summary: Recipient answers "was this something you needed to hear?"
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppreciationInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppreciationResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/w/{token}/remind-me:
    post:
      operationId: requestWhispReminder
      tags: [public]
      summary: Recipient schedules a "remind me later" nudge (max 2 total, must land before expiry)
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemindMeInput"
      responses:
        "200":
          description: Reminder scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemindMeResult"
        "400":
          description: Reminder not available (expired, out of reminders, or time out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: Whisp has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /user/profile:
    get:
      operationId: getUserProfile
      tags: [user]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateUserProfile
      tags: [user]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /user/push-public-key:
    get:
      operationId: getPushPublicKey
      tags: [user]
      summary: Get the VAPID public key used to subscribe to push notifications
      responses:
        "200":
          description: Public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPublicKeyResponse"
        "503":
          description: Push notifications are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /user/push-subscription:
    post:
      operationId: createPushSubscription
      tags: [user]
      summary: Register a browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResult"
    delete:
      operationId: deletePushSubscription
      tags: [user]
      summary: Remove a browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionDeleteInput"
      responses:
        "204":
          description: Unsubscribed

  /credits/transactions:
    get:
      operationId: listCreditTransactions
      tags: [credits]
      summary: List credit transactions for current user
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditTransaction"

  /circles:
    get:
      operationId: listMyCircles
      tags: [circles]
      summary: List private circles the current user belongs to
      responses:
        "200":
          description: Circles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Circle"
    post:
      operationId: createCircle
      tags: [circles]
      summary: Create a new private circle (creator becomes the first member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCircleInput"
      responses:
        "201":
          description: Circle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Circle"

  /circles/join:
    post:
      operationId: joinCircle
      tags: [circles]
      summary: Join a private circle using its invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinCircleInput"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Circle"
        "404":
          description: Invalid invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /circles/{id}/feed:
    get:
      operationId: getCircleWhisps
      tags: [circles]
      summary: Feed of whisps dropped into this circle (members only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Circle feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleFeedResponse"
        "403":
          description: Not a member of this circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/circle:
    get:
      operationId: listCircleFeed
      tags: [public]
      summary: Community discovery feed of Circle Drop whisps (no auth required)
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
          required: false
      responses:
        "200":
          description: Circle feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleFeedResponse"

  /billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Create a Stripe Checkout session for a credit pack or plan upgrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "402":
          description: Payment required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Billing not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List users (admin only)
      parameters:
        - in: query
          name: search
          schema:
            type: string
          required: false
        - in: query
          name: plan
          schema:
            type: string
          required: false
        - in: query
          name: role
          schema:
            type: string
          required: false
        - in: query
          name: banned
          schema:
            type: string
          required: false
        - in: query
          name: page
          schema:
            type: integer
          required: false
        - in: query
          name: pageSize
          schema:
            type: integer
          required: false
      responses:
        "200":
          description: Users page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/users/{id}:
    get:
      operationId: adminGetUser
      tags: [admin]
      summary: Get a user's full profile and recent activity (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Update a user's role, plan, credits, or banned status (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: adminDeleteUser
      tags: [admin]
      summary: Delete a user and all of their data (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/whisps:
    get:
      operationId: adminListWhisps
      tags: [admin]
      summary: List all whisps across all users (admin only)
      parameters:
        - in: query
          name: search
          schema:
            type: string
          required: false
        - in: query
          name: status
          schema:
            type: string
          required: false
        - in: query
          name: deliveryMethod
          schema:
            type: string
          required: false
        - in: query
          name: category
          schema:
            type: string
          required: false
        - in: query
          name: page
          schema:
            type: integer
          required: false
        - in: query
          name: pageSize
          schema:
            type: integer
          required: false
      responses:
        "200":
          description: Whisps page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWhispListResponse"

  /admin/whisps/{id}:
    get:
      operationId: adminGetWhisp
      tags: [admin]
      summary: Get full detail on any whisp (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Whisp detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWhispDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: adminDeleteWhisp
      tags: [admin]
      summary: Remove a whisp (moderation) (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/stats/overview:
    get:
      operationId: adminGetOverviewStats
      tags: [admin]
      summary: App-wide overview stats (admin only)
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverviewStats"

  /admin/stats/categories:
    get:
      operationId: adminGetCategoryStats
      tags: [admin]
      summary: Video category rankings across all sent whisps (admin only)
      responses:
        "200":
          description: Category stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategoryStatsResponse"

  /admin/stats/delivery-methods:
    get:
      operationId: adminGetDeliveryMethodStats
      tags: [admin]
      summary: Delivery method usage breakdown (admin only)
      responses:
        "200":
          description: Delivery method stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeliveryMethodStatsResponse"

  /admin/stats/locations:
    get:
      operationId: adminGetLocationStats
      tags: [admin]
      summary: User geography breakdown (admin only)
      responses:
        "200":
          description: Location stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLocationStatsResponse"

  /admin/stats/opportunities:
    get:
      operationId: adminGetOpportunities
      tags: [admin]
      summary: Smart analytics — computed growth/quality opportunities (admin only)
      responses:
        "200":
          description: Opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOpportunitiesResponse"

  /admin/suggestions:
    get:
      operationId: adminListSuggestions
      tags: [admin, suggestions]
      summary: List Suggestions Library videos, including pending AI-agent finds (admin only)
      parameters:
        - in: query
          name: search
          schema:
            type: string
          required: false
        - in: query
          name: status
          schema:
            type: string
          required: false
        - in: query
          name: source
          schema:
            type: string
          required: false
        - in: query
          name: category
          schema:
            type: string
          required: false
        - in: query
          name: featured
          schema:
            type: string
          required: false
        - in: query
          name: page
          schema:
            type: integer
          required: false
        - in: query
          name: pageSize
          schema:
            type: integer
          required: false
      responses:
        "200":
          description: Suggestions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionListResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: adminCreateSuggestion
      tags: [admin, suggestions]
      summary: Add a video to the Suggestions Library (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSuggestionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedVideo"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Video is private, restricted, or otherwise unusable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/suggestions/agent-status:
    get:
      operationId: adminGetSuggestionAgentStatus
      tags: [admin, suggestions]
      summary: Get the AI discovery agent's last run outcome, including whether it looks blocked by a low Anthropic credit balance (admin only)
      responses:
        "200":
          description: Agent status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionAgentStatus"

  /admin/suggestions/run-agent:
    post:
      operationId: adminRunSuggestionAgent
      tags: [admin, suggestions]
      summary: Trigger an AI discovery sweep immediately instead of waiting for the daily schedule (admin only)
      responses:
        "200":
          description: Run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSuggestionAgentResult"

  /admin/suggestions/{id}:
    get:
      operationId: adminGetSuggestion
      tags: [admin, suggestions]
      summary: Get a single Suggestions Library entry (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Suggestion detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedVideo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: adminUpdateSuggestion
      tags: [admin, suggestions]
      summary: Approve, edit, or archive a Suggestions Library entry (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSuggestionInput"
      responses:
