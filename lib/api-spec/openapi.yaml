      tags: [public]
      summary: Fetch a Blind Circle comment's attached image
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
        - in: path
          name: commentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: No image, or it's pending/failed moderation review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/w/{token}/handle:
    patch:
      operationId: renameCircleHandle
      tags: [public]
      summary: Rename the caller's own anonymous handle in this post's comment thread
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visitorId:
                  type: string
                handle:
                  type: string
              required: [visitorId, handle]
      responses:
        "200":
          description: Handle updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  handle:
                    type: string
                required: [handle]
        "400":
          description: Invalid handle, or already taken in this thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/w/{token}/circle-dm/start:
    post:
      operationId: startCircleDm
      tags: [public]
      summary: Start (or is idempotently expected to be reused for) a private anonymous conversation with a Blind Circle post's poster
      description: >-
        Mints a new whisp (deliveryMethod='circle_dm') the caller can now
        message the poster through via the ordinary POST /w/{token}/reply on
        the RETURNED token, exactly like a Whisper Link. The frontend is
        responsible for remembering the returned token per origin post
        (localStorage) so a repeat visitor resumes the same conversation
        instead of starting a new one on every click.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Conversation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicToken:
                    type: string
                required: [publicToken]
        "400":
          description: Not a Blind Circle post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/w/{token}/remind-me:
    post:
      operationId: requestWhispReminder
      tags: [public]
      summary: Recipient schedules a "remind me later" nudge (max 2 total, must land before expiry)
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemindMeInput"
      responses:
        "200":
          description: Reminder scheduled
          content:
