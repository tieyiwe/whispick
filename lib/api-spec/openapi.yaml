            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "402":
          description: Payment required — Whisper Link plan limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # POST /media/upload (multipart/form-data video+thumbnail+durationSeconds
  # → UploadedVideo | 400 | 503 ApiError) is intentionally not modeled here:
  # a `format: binary` request body generates `File`/`Blob`-typed Zod schemas
  # that don't compile in lib/api-zod's Node-only (no DOM lib) project, and
  # this endpoint is called via a hand-written fetch from the frontend
  # anyway (multipart isn't a great fit for the generated JSON client) — see
  # artifacts/blindwhisper/src/lib/uploadMedia.ts.

  /media:
    get:
      operationId: listMedia
      tags: [media]
      summary: The sender's Media Library — their own uploaded clips, with a per-clip usage count
      responses:
        "200":
          description: Uploaded videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadedVideo"

  /media/{id}:
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Remove an uploaded video ahead of its automatic retention deadline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/subscribe:
    post:
      operationId: subscribeToMatching
      tags: [matching]
      summary: Opt in to receive anonymous Ghost Boost whisps on chosen topics (no account needed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeInput"
      responses:
        "200":
          description: Subscribed — a verification email was sent unless already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/subscribe/verify:
    get:
      operationId: verifySubscription
      tags: [matching]
      summary: Confirm a subscription via the emailed verification link
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/subscribe/unsubscribe:
    get:
      operationId: unsubscribeFromMatching
      tags: [matching]
      summary: One-click unsubscribe via the emailed link
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unsubscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /whisps/note-suggestions:
    post:
      operationId: getNoteSuggestions
      tags: [whisps]
      summary: AI-suggested anonymous note options for the composer's "help me find the words" button
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteSuggestionsInput"
      responses:
        "200":
          description: Suggested note options (may be empty if generation is unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteSuggestionsResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /whisps/concierge:
    post:
      operationId: getConciergeSuggestions
      tags: [whisps]
      summary: >-
        "Not sure what to send?" — the sender describes their situation in a
        sentence or two and gets back up to a few Suggestions Library videos
        that fit, plus a drafted anonymous note. Matches only against the
        existing curated library, never a live discovery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConciergeInput"
      responses:
        "200":
          description: Matched video suggestions (may be empty) and a drafted note (may be null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /whisps/{id}/matches:
    get:
      operationId: getGhostBoostMatches
      tags: [whisps]
      summary: Aggregate-only reach stats for a Ghost Boost whisp (never a per-subscriber breakdown)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchStats"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error

    Whisp:
      type: object
      properties:
        id:
          type: string
        senderId:
          type: string
        videoUrl:
          type: string
        videoTitle:
          type: ["string", "null"]
        videoThumbnail:
          type: ["string", "null"]
        videoEmbedUrl:
          type: ["string", "null"]
        videoStartSeconds:
          type: ["integer", "null"]
        videoEndSeconds:
          type: ["integer", "null"]
        videoPlatform:
          type: ["string", "null"]
        videoTranscript:
          type: ["string", "null"]
        uploadedVideoId:
          type: ["string", "null"]
        deliveryMethod:
          type: string
        whisperChannel:
          type: ["string", "null"]
        circleId:
          type: ["string", "null"]
        recipientEmail:
          type: ["string", "null"]
        recipientPhone:
          type: ["string", "null"]
        anonymousNote:
          type: ["string", "null"]
        senderAlias:
          type: ["string", "null"]
        moodTag:
          type: ["string", "null"]
        status:
          type: string
        publicToken:
          type: string
        scheduledAt:
          type: ["string", "null"]
        deliveredAt:
          type: ["string", "null"]
        openedAt:
          type: ["string", "null"]
        watchedAt:
          type: ["string", "null"]
        revealRequested:
          type: boolean
        revealAccepted:
          type: ["boolean", "null"]
        appreciationResponse:
          type: ["string", "null"]
        appreciationRespondedAt:
          type: ["string", "null"]
        aiTakeaway:
          type: ["string", "null"]
        aiTakeawayStatus:
          type: ["string", "null"]
        conciergeRequestId:
          type: ["string", "null"]
          description: Set when this whisp's video and/or note came from the "Not sure what to send?" AI concierge (see POST /whisps/concierge)
        createdAt:
          type: string
      required:
        - id
        - senderId
        - videoUrl
        - deliveryMethod
        - status
        - publicToken
        - revealRequested
        - createdAt

    WhispInput:
      type: object
      properties:
        videoUrl:
          type: ["string", "null"]
        videoTitle:
          type: ["string", "null"]
        videoThumbnail:
          type: ["string", "null"]
        videoEmbedUrl:
          type: ["string", "null"]
        videoStartSeconds:
          type: ["integer", "null"]
        videoEndSeconds:
          type: ["integer", "null"]
        videoPlatform:
          type: ["string", "null"]
        uploadedVideoId:
          type: ["string", "null"]
          description: An id from the sender's Media Library — an alternative to videoUrl. One of the two is required.
        deliveryMethod:
          type: string
        whisperChannel:
          type: ["string", "null"]
        circleId:
          type: ["string", "null"]
        recipientEmail:
          type: ["string", "null"]
        recipientPhone:
          type: ["string", "null"]
        anonymousNote:
          type: ["string", "null"]
        senderAlias:
          type: ["string", "null"]
        moodTag:
          type: ["string", "null"]
        scheduledAt:
          type: ["string", "null"]
        conciergeRequestId:
          type: ["string", "null"]
          description: The requestId from a prior POST /whisps/concierge call, if this send used its video suggestion and/or note draft
      required:
        - deliveryMethod

    WhispDetail:
      type: object
      properties:
        whisp:
          $ref: "#/components/schemas/Whisp"
        trackingEvents:
          type: array
          items:
            $ref: "#/components/schemas/TrackingEvent"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/WhispReply"
        recipientRepliesRemaining:
          type: ["integer", "null"]
          description: >-
            Anonymous replies the recipient has left on this whisp. Null means
            uncapped. 0 means they can't reply again unless the sender adds
            more replies or the recipient signs up.
      required:
        - whisp
        - trackingEvents
        - replies

    WhispStats:
      type: object
      properties:
        totalSent:
          type: integer
        totalOpened:
          type: integer
        totalWatched:
          type: integer
        totalReplied:
          type: integer
        totalAppreciated:
          type: integer
        deliveryRate:
          type: number
        openRate:
          type: number
        boostCredits:
          type: integer
        plan:
          type: string
        recentWhisps:
          type: array
          items:
            $ref: "#/components/schemas/Whisp"
      required:
        - totalSent
        - totalOpened
        - totalWatched
        - totalReplied
        - totalAppreciated
        - deliveryRate
        - openRate
        - boostCredits
        - plan
        - recentWhisps

    WhispReply:
      type: object
      properties:
        id:
          type: string
        whispId:
          type: string
        replyText:
          type: string
        fromRecipient:
          type: boolean
        videoUrl:
          type: ["string", "null"]
        videoTitle:
          type: ["string", "null"]
        videoThumbnail:
          type: ["string", "null"]
        videoEmbedUrl:
          type: ["string", "null"]
        videoPlatform:
          type: ["string", "null"]
        moodTag:
          type: ["string", "null"]
        parentReplyId:
          type: ["string", "null"]
          description: >-
            The message this one answers, when it replies to a specific
            earlier message rather than the thread as a whole. Always a reply
            on the same whisp.
        createdAt:
          type: string
        readAt:
          type: ["string", "null"]
          description: >-
            When the other party in the conversation (whichever one didn't
            author this message) is known to have viewed it — set the moment
            they load a view containing it. Null means unread. Drives the
            WhatsApp-style single/double checkmark next to a message the
            current viewer sent themselves; never rendered on a message you
            received.
      required:
        - id
        - whispId
        - replyText
        - fromRecipient
        - createdAt

    WhispReplyInput:
      type: object
      properties:
        replyText:
          type: string
        fromRecipient:
          type: boolean
        parentReplyId:
          type: ["string", "null"]
          description: Reply to a specific earlier message on the same whisp.
      required:
        - replyText

    RevealResponse:
      type: object
      properties:
        accepted:
          type: boolean
      required:
        - accepted

    RevealResult:
      type: object
      properties:
        id:
          type: string
        revealRequested:
          type: boolean
        revealAccepted:
          type: boolean
      required:
        - id
        - revealRequested
        - revealAccepted

    TextWhisp:
      type: object
      properties:
        id:
          type: string
        senderId:
          type: string
        viewerIsRecipient:
          type: boolean
          description: True only if the authenticated caller IS this Text Whisp's recipient. Deliberately caller-relative and self-referential (safe for a sender to see, since it's always false for their own sent messages) rather than exposing the underlying recipientUserId, which would let a sender learn whether an arbitrary phone number belongs to a verified Blind Whisper account.
        recipientPhone:
          type: string
          description: The E.164-normalized phone number provided at send time, regardless of whether it matched a user.
        publicToken:
          type: string
          description: Token for the public guest landing page (/tw/{publicToken}, see GET /public/text-whisps/{token}). Always set, even for a matched in-app send.
        senderAlias:
          type: ["string", "null"]
        messageText:
          type: string
          maxLength: 260
        status:
          type: string
          description: "'sent' | 'read' | 'replied'"
        revealRequested:
          type: boolean
        revealAccepted:
          type: ["boolean", "null"]
        readAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - senderId
        - viewerIsRecipient
        - recipientPhone
        - publicToken
        - messageText
        - status
        - revealRequested
        - createdAt

    TextWhispInput:
      type: object
      properties:
        recipientPhone:
          type: string
        messageText:
          type: string
          maxLength: 260
        senderAlias:
          type: ["string", "null"]
      required:
        - recipientPhone
        - messageText

    TextWhispDetail:
      type: object
      properties:
        textWhisp:
          $ref: "#/components/schemas/TextWhisp"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/TextWhispReply"
      required:
        - textWhisp
        - replies

    TextWhispReply:
      type: object
      properties:
        id:
          type: string
        textWhispId:
          type: string
        senderId:
          type: string
        replyText:
          type: string
          maxLength: 260
        createdAt:
          type: string
      required:
        - id
        - textWhispId
        - senderId
        - replyText
        - createdAt

    TextWhispReplyInput:
      type: object
      properties:
        replyText:
          type: string
          maxLength: 260
      required:
        - replyText

    Invite:
      type: object
      properties:
        id:
          type: string
        inviterUserId:
          type: string
        recipientEmail:
          type: ["string", "null"]
        recipientPhone:
          type: ["string", "null"]
        channel:
          type: string
        publicToken:
          type: string
        status:
          type: string
        signedUpUserId:
          type: ["string", "null"]
        signedUpAt:
          type: ["string", "null"]
        revealRequested:
          type: boolean
        revealAccepted:
          type: ["boolean", "null"]
        createdAt:
          type: string
      required:
        - id
        - inviterUserId
        - channel
        - publicToken
        - status
        - revealRequested
        - createdAt

    InviteInput:
      type: object
      properties:
        recipientEmail:
          type: ["string", "null"]
        recipientPhone:
          type: ["string", "null"]
        channel:
          type: string
      required:
        - channel

    ClaimInviteInput:
      type: object
      properties:
        token:
          type: string
      required:
        - token

    ClaimInviteResult:
      type: object
      properties:
        ok:
          type: boolean
        alreadyClaimed:
          type: boolean
        selfInvite:
          type: boolean
      required:
        - ok

    PublicInvite:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        revealRequested:
          type: boolean
        revealAccepted:
          type: ["boolean", "null"]
      required:
        - id
        - status
        - revealRequested

    PublicTextWhisp:
      type: object
      description: Public-safe fields only — never senderId, recipientUserId, or recipientPhone. See GET /public/text-whisps/{token}.
      properties:
        id:
          type: string
        messageText:
          type: string
          maxLength: 260
        senderAlias:
          type: ["string", "null"]
        status:
          type: string
          description: "'sent' | 'read' | 'replied'"
        revealRequested:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - messageText
        - status
        - revealRequested
        - createdAt

    VideoMetaRequest:
      type: object
      properties:
        url:
          type: string
      required:
        - url

    VideoMeta:
      type: object
      properties:
        title:
          type: ["string", "null"]
        thumbnail:
          type: ["string", "null"]
        platform:
          type: string
        embedUrl:
          type: ["string", "null"]
        authorName:
          type: ["string", "null"]
        noPreview:
          type: boolean
          description: True when we couldn't scrape a real preview (currently only for Facebook/Instagram) — the link is likely still fine, we just can't show what it looks like ahead of time.
      required:
        - platform

    PublicWhisp:
      type: object
      properties:
        id:
          type: string
        videoUrl:
          type: string
        videoTitle:
          type: ["string", "null"]
        videoThumbnail:
          type: ["string", "null"]
        videoEmbedUrl:
          type: ["string", "null"]
        videoStartSeconds:
          type: ["integer", "null"]
        videoEndSeconds:
          type: ["integer", "null"]
        videoPlatform:
          type: ["string", "null"]
        anonymousNote:
          type: ["string", "null"]
        senderAlias:
          type: ["string", "null"]
        moodTag:
          type: ["string", "null"]
        revealRequested:
          type: boolean
        groupSize:
          type: ["integer", "null"]
        appreciationResponse:
          type: ["string", "null"]
        expiresAt:
          type: ["string", "null"]
          format: date-time
        reminderCount:
          type: integer
        expired:
          type: boolean
        hasUpload:
          type: boolean
        aiTakeaway:
          type: ["string", "null"]
        aiTakeawayStatus:
          type: ["string", "null"]
        replies:
          type: array
          items:
            $ref: "#/components/schemas/WhispReply"
        recipientRepliesRemaining:
          type: ["integer", "null"]
          description: >-
            Anonymous replies this recipient has left on this whisp. Null
            means uncapped. Signing up removes the cap entirely.
        videoRepliesAllowed:
          type: boolean
          description: >-
            Whether this viewer may whisp a VIDEO back. Text replies stay open
            to anonymous recipients up to their allowance; a video reply needs
            either an account or reply credit the sender bought for this whisp.
        hasWatched:
          type: boolean
          description: >-
            Whether this whisp was already marked watched (whisps.watchedAt)
            BEFORE this request — true only on a reopen, never on the load
            that itself does the watching. Drives whether the appreciation
            prompt starts expanded or collapsed.
      required:
        - id
        - videoUrl
        - revealRequested
        - expired
        - hasUpload
        - replies

    TrackingEvent:
      type: object
      properties:
        id:
          type: string
        whispId:
          type: string
        eventType:
          type: string
        createdAt:
          type: string
      required:
        - id
        - whispId
        - eventType
        - createdAt

    TrackingEventInput:
      type: object
      properties:
        eventType:
          type: string
      required:
        - eventType

    TrackingResult:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok

    PublicReplyInput:
      type: object
      properties:
        replyText:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        videoTitle:
          type: ["string", "null"]
        videoThumbnail:
          type: ["string", "null"]
        videoEmbedUrl:
          type: ["string", "null"]
        videoPlatform:
          type: ["string", "null"]
        moodTag:
          type: ["string", "null"]
        parentReplyId:
          type: ["string", "null"]
          description: Reply to a specific earlier message on the same whisp.

    UserProfile:
      type: object
      properties:
        id:
          type: string
        clerkId:
          type: string
        email:
          type: string
        fullName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        phoneVerifiedAt:
          type: ["string", "null"]
          description: Null means this phone number has NOT been confirmed via our own Twilio Verify one-time-code flow (see POST /user/phone/confirm-verification) — never trust `phone` alone as proof of ownership, even when set.
        gender:
          type: ["string", "null"]
          description: "'woman' | 'man' | 'nonbinary' | 'prefer_not_to_say' | null (not yet answered)"
        ageRange:
          type: ["string", "null"]
          description: "'13-17' | '18-24' | '25-34' | '35-44' | '45-54' | '55-64' | '65+' | 'prefer_not_to_say' | null (not yet answered)"
        plan:
          type: string
        boostCredits:
          type: integer
        whisperLinksUsed:
          type: integer
        role:
          type: string
        createdAt:
          type: string
      required:
        - id
        - clerkId
        - email
        - plan
        - boostCredits
        - whisperLinksUsed
        - role
        - createdAt

    UserProfileUpdate:
      type: object
      properties:
        fullName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        ageRange:
          type: ["string", "null"]

    StartPhoneVerificationInput:
      type: object
      properties:
        phone:
          type: string
      required:
        - phone

    ConfirmPhoneVerificationInput:
      type: object
      properties:
        phone:
          type: string
        code:
          type: string
      required:
        - phone
        - code

    PhoneVerificationResult:
      type: object
      properties:
        phone:
          type: ["string", "null"]
        phoneVerifiedAt:
          type: ["string", "null"]
      required:
        - phone
        - phoneVerifiedAt

    CreditTransaction:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
        amount:
          type: integer
        whispId:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - userId
        - type
        - amount
        - createdAt

    CircleFeedItem:
      type: object
      properties:
        id:
          type: string
        videoUrl:
          type: string
        videoTitle:
          type: ["string", "null"]
        videoThumbnail:
          type: ["string", "null"]
        videoPlatform:
          type: ["string", "null"]
        anonymousNote:
          type: ["string", "null"]
        senderAlias:
          type: ["string", "null"]
        moodTag:
          type: ["string", "null"]
        publicToken:
          type: string
        createdAt:
          type: string
      required:
        - id
        - videoUrl
        - publicToken
        - createdAt

    CircleFeedResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CircleFeedItem"
        nextCursor:
          type: ["string", "null"]
      required:
        - items
        - nextCursor

    Circle:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ownerId:
          type: string
        inviteCode:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - ownerId
        - inviteCode
        - createdAt

    CreateCircleInput:
      type: object
      properties:
        name:
          type: string
      required:
        - name

    JoinCircleInput:
      type: object
      properties:
        inviteCode:
          type: string
      required:
        - inviteCode

    PushPublicKeyResponse:
      type: object
      properties:
        publicKey:
          type: string
      required:
        - publicKey

    PushSubscriptionKeys:
      type: object
      properties:
        p256dh:
          type: string
        auth:
          type: string
      required:
        - p256dh
        - auth

    PushSubscriptionInput:
      type: object
      properties:
