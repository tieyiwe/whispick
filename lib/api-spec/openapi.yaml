          type: string
          minLength: 1
          maxLength: 500
          description: The sender's own free-text description of who this is for and why, e.g. "my friend is going through a rough breakup"
      required:
        - situation

    ConciergeResult:
      type: object
      properties:
        requestId:
          type: string
          description: concierge_requests id — pass back as conciergeRequestId on POST /whisps if the sender goes on to send using this request's suggestions
        videoSuggestions:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedVideo"
          description: 0-3 Suggestions Library videos matched to the situation, ranked best-first — empty when nothing in the library fit well
        noteDraft:
          type: ["string", "null"]
          description: A single drafted anonymous note the sender can use as-is or edit — null if generation was unavailable
        matchedCategories:
          type: array
          items:
            type: string
          description: The fixed taxonomy category keys (see the categories field on GET /suggestions) the model matched from the situation text
      required:
        - requestId
        - videoSuggestions
        - noteDraft
        - matchedCategories

