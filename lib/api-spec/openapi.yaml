      responses:
        "200":
          description: Group sends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupWhispSendSummary"

  /whisper-groups/sends/{groupSendId}:
    get:
      operationId: getGroupWhispSend
