            application/json:
              schema:
                $ref: "#/components/schemas/WhisperGroupDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: renameWhisperGroup
      tags: [whisperGroups]
      summary: Rename a whisper group
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhisperGroupNameInput"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhisperGroup"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteWhisperGroup
      tags: [whisperGroups]
      summary: Delete a whisper group and its saved member list
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /whisper-groups/{id}/members:
    post:
      operationId: addWhisperGroupMembers
      tags: [whisperGroups]
      summary: Add one or more members to a whisper group (manual entry or a Contact Picker batch)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWhisperGroupMembersInput"
      responses:
        "201":
          description: Updated member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhisperGroupMember"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /whisper-groups/{id}/members/{memberId}:
    delete:
      operationId: removeWhisperGroupMember
      tags: [whisperGroups]
