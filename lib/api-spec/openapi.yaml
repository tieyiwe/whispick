        videoTitle:
          type: ["string", "null"]
        videoThumbnail:
          type: ["string", "null"]
        videoEmbedUrl:
          type: ["string", "null"]
        videoStartSeconds:
          type: ["integer", "null"]
        videoEndSeconds:
