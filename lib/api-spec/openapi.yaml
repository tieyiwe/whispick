    AdminFunnelStats:
      type: object
      properties:
        funnel:
          type: object
          description: Sent → delivered → opened → watched → replied across every recipient-directed whisp (whisper_link, group_whisper, ghost_boost) — circle_drop is excluded since it has no single recipient to fall off for.
          properties:
            sent:
              type: integer
            delivered:
              type: integer
            failed:
              type: integer
            opened:
              type: integer
            watched:
              type: integer
            replied:
              type: integer
            appreciated:
              type: integer
              description: Recipients who answered "yes" to "was this something you needed to hear?"
          required: [sent, delivered, failed, opened, watched, replied, appreciated]
        deliveryByChannel:
          type: array
          items:
            $ref: "#/components/schemas/AdminChannelDeliveryStat"
        ghostBoost:
          type: object
          properties:
            campaigns:
              type: integer
            totalMatched:
              type: integer
            avgMatchedPerCampaign:
              type: number
          required: [campaigns, totalMatched, avgMatchedPerCampaign]
        circles:
          type: object
          properties:
            totalCircles:
              type: integer
            totalMembers:
              type: integer
            totalDrops:
              type: integer
          required: [totalCircles, totalMembers, totalDrops]
        concierge:
          type: object
          description: Usage of the "Not sure what to send?" AI concierge (POST /whisps/concierge).
          properties:
            totalRequests:
              type: integer
            requestsWithVideoMatch:
              type: integer
              description: Requests where at least one Suggestions Library video was matched (as opposed to falling back to note-draft-only).
            sends:
              type: integer
              description: Whisps actually sent using a concierge request's video and/or note (whisps.conciergeRequestId is set).
          required: [totalRequests, requestsWithVideoMatch, sends]
        phoneMatchRouting:
          type: object
          description: Proof the Twilio-skip matching in lib/deliver.ts is saving money — every whisper_link/group_whisper SMS-or-WhatsApp send attempt (initial send, reminders, reveal-request, reply-to-recipient), split by whether it was routed in-app (recipient phone matched a known, OTP-verified user) or actually went through Twilio (unmatched).
          properties:
            inApp:
              type: integer
            twilio:
              type: integer
            matchRate:
              type: number
              description: Percentage (0-100) of these sends that were routed in-app instead of through Twilio.
          required: [inApp, twilio, matchRate]
        invites:
          type: object
          description: Anonymous invite-a-friend (routes/invites.ts) volume and how many actually converted into a real account.
          properties:
            sent:
              type: integer
            joined:
              type: integer
              description: Invites whose recipient actually created a Blind Whisper account via the invite link (status = 'joined').
            conversionRate:
              type: number
              description: Percentage (0-100) of sent invites that converted to a joined account.
          required: [sent, joined, conversionRate]
        textWhisps:
          type: object
          description: Text Whisp (routes/textWhisps.ts) volume and how far it gets read/replied — a separate, text-only content type, not folded into the whisp funnel above. deliveredInApp/deliveredGuest mirror phoneMatchRouting's in-app-vs-Twilio split, one level up (recipientUserId set vs. null at send time).
          properties:
            sent:
              type: integer
            read:
              type: integer
            replied:
              type: integer
            deliveredInApp:
              type: integer
              description: Text Whisps whose recipient phone matched a known, verified account at send time (recipientUserId is set) — delivered entirely in-app.
            deliveredGuest:
              type: integer
              description: Text Whisps sent to a phone number that wasn't a known, verified account at send time (recipientUserId is null) — delivered as a public guest link over SMS.
          required: [sent, read, replied, deliveredInApp, deliveredGuest]
      required:
        - funnel
        - deliveryByChannel
        - ghostBoost
        - circles
        - concierge
        - phoneMatchRouting
        - invites
        - textWhisps

