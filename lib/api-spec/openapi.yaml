            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /whisper-groups/{id}/send:
    post:
      operationId: sendGroupWhisp
      tags: [whisperGroups]
      summary: Send a whisp to every deliverable member of a whisper group, anonymously
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendGroupWhispInput"
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendGroupWhispResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "402":
          description: Payment required — Whisper Link plan limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # POST /media/upload (multipart/form-data video+thumbnail+durationSeconds
  # → UploadedVideo | 400 | 503 ApiError) is intentionally not modeled here:
  # a `format: binary` request body generates `File`/`Blob`-typed Zod schemas
  # that don't compile in lib/api-zod's Node-only (no DOM lib) project, and
  # this endpoint is called via a hand-written fetch from the frontend
  # anyway (multipart isn't a great fit for the generated JSON client) — see
  # artifacts/blindwhisper/src/lib/uploadMedia.ts.

  /media:
    get:
      operationId: listMedia
      tags: [media]
      summary: The sender's Media Library — their own uploaded clips, with a per-clip usage count
      responses:
        "200":
          description: Uploaded videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadedVideo"

  /media/{id}:
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Remove an uploaded video ahead of its automatic retention deadline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/subscribe:
    post:
      operationId: subscribeToMatching
      tags: [matching]
      summary: Opt in to receive anonymous Ghost Boost whisps on chosen topics (no account needed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeInput"
      responses:
        "200":
          description: Subscribed — a verification email was sent unless already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/subscribe/verify:
    get:
      operationId: verifySubscription
      tags: [matching]
      summary: Confirm a subscription via the emailed verification link
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/subscribe/unsubscribe:
    get:
      operationId: unsubscribeFromMatching
      tags: [matching]
      summary: One-click unsubscribe via the emailed link
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unsubscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /whisps/note-suggestions:
    post:
      operationId: getNoteSuggestions
      tags: [whisps]
      summary: AI-suggested anonymous note options for the composer's "help me find the words" button
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteSuggestionsInput"
      responses:
        "200":
          description: Suggested note options (may be empty if generation is unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteSuggestionsResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /whisps/{id}/matches:
    get:
      operationId: getGhostBoostMatches
      tags: [whisps]
      summary: Aggregate-only reach stats for a Ghost Boost whisp (never a per-subscriber breakdown)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchStats"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error

    Whisp:
      type: object
      properties:
        id:
          type: string
        senderId:
          type: string
        videoUrl:
          type: string
        videoTitle:
          type: ["string", "null"]
        videoThumbnail:
          type: ["string", "null"]
        videoEmbedUrl:
          type: ["string", "null"]
        videoStartSeconds:
          type: ["integer", "null"]
        videoEndSeconds:
          type: ["integer", "null"]
        videoPlatform:
          type: ["string", "null"]
        videoTranscript:
          type: ["string", "null"]
        uploadedVideoId:
          type: ["string", "null"]
        deliveryMethod:
          type: string
        whisperChannel:
          type: ["string", "null"]
        circleId:
          type: ["string", "null"]
        recipientEmail:
          type: ["string", "null"]
        recipientPhone:
          type: ["string", "null"]
        anonymousNote:
          type: ["string", "null"]
        senderAlias:
          type: ["string", "null"]
        moodTag:
          type: ["string", "null"]
        status:
          type: string
        publicToken:
          type: string
        scheduledAt:
          type: ["string", "null"]
        deliveredAt:
          type: ["string", "null"]
        openedAt:
          type: ["string", "null"]
        watchedAt:
          type: ["string", "null"]
        revealRequested:
          type: boolean
        revealAccepted:
          type: ["boolean", "null"]
        appreciationResponse:
          type: ["string", "null"]
        appreciationRespondedAt:
          type: ["string", "null"]
        aiTakeaway:
          type: ["string", "null"]
        aiTakeawayStatus:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - senderId
        - videoUrl
        - deliveryMethod
        - status
        - publicToken
        - revealRequested
        - createdAt

    WhispInput:
      type: object
      properties:
        videoUrl:
          type: ["string", "null"]
        videoTitle:
          type: ["string", "null"]
        videoThumbnail:
          type: ["string", "null"]
        videoEmbedUrl:
          type: ["string", "null"]
        videoStartSeconds:
          type: ["integer", "null"]
        videoEndSeconds:
          type: ["integer", "null"]
        videoPlatform:
          type: ["string", "null"]
        uploadedVideoId:
          type: ["string", "null"]
          description: An id from the sender's Media Library — an alternative to videoUrl. One of the two is required.
        deliveryMethod:
          type: string
        whisperChannel:
          type: ["string", "null"]
        circleId:
          type: ["string", "null"]
        recipientEmail:
          type: ["string", "null"]
        recipientPhone:
          type: ["string", "null"]
        anonymousNote:
          type: ["string", "null"]
        senderAlias:
          type: ["string", "null"]
        moodTag:
          type: ["string", "null"]
        scheduledAt:
          type: ["string", "null"]
      required:
        - deliveryMethod

    WhispDetail:
      type: object
      properties:
        whisp:
          $ref: "#/components/schemas/Whisp"
        trackingEvents:
          type: array
          items:
            $ref: "#/components/schemas/TrackingEvent"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/WhispReply"
      required:
        - whisp
        - trackingEvents
        - replies

    WhispStats:
      type: object
      properties:
        totalSent:
          type: integer
        totalOpened:
          type: integer
        totalWatched:
          type: integer
        totalReplied:
          type: integer
        deliveryRate:
          type: number
        openRate:
          type: number
        boostCredits:
          type: integer
        plan:
          type: string
        recentWhisps:
          type: array
          items:
            $ref: "#/components/schemas/Whisp"
      required:
        - totalSent
        - totalOpened
        - totalWatched
        - totalReplied
        - deliveryRate
        - openRate
        - boostCredits
        - plan
        - recentWhisps

    WhispReply:
      type: object
      properties:
        id:
          type: string
        whispId:
          type: string
        replyText:
          type: string
        fromRecipient:
          type: boolean
        videoUrl:
          type: ["string", "null"]
        videoTitle:
          type: ["string", "null"]
        videoThumbnail:
          type: ["string", "null"]
        videoEmbedUrl:
          type: ["string", "null"]
        videoPlatform:
          type: ["string", "null"]
        moodTag:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - whispId
        - replyText
        - fromRecipient
        - createdAt

    WhispReplyInput:
      type: object
      properties:
        replyText:
          type: string
