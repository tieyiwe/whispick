openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Blind Whisper API — anonymous video recommendation platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: whisps
    description: Whisp management
  - name: video
    description: Video metadata
  - name: public
    description: Public recipient endpoints
  - name: user
    description: User profile
  - name: credits
    description: Credit & plan management
  - name: billing
    description: Stripe checkout
  - name: circles
    description: Private invite-only circles
  - name: admin
    description: App-owner admin panel — user/content management and analytics
  - name: whisperGroups
    description: Saved contact groups for sending one whisp to several people at once, anonymously
  - name: suggestions
    description: Admin-curated + AI-discovered Suggestions Library
  - name: invites
    description: Anonymous invite-a-friend — inviting someone to join Blind Whisper itself, sent the same anonymous way as a whisp
  - name: textWhisps
    description: Text Whisps — short, text-only anonymous messages between two known, verified Blind Whisper users, delivered entirely in-app
  - name: debateTopics
    description: Debate Topics — short, title-length debate prompts a Whisperer posts anonymously to a public feed anyone can browse and comment on, no account required to read or comment
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /whisps:
    get:
      operationId: listWhisps
      tags: [whisps]
      summary: List whisps sent by the current user (default), or received by them
      parameters:
        - in: query
          name: status
          schema:
            type: string
          required: false
        - in: query
          name: box
          schema:
            type: string
            enum: [sent, received, archived]
          required: false
          description: "'sent' (default): whisps this user sent. 'received': whisps another Whisperer sent TO this user (matched at send time — see whisps.recipientUserId). 'archived': whichever of those this user archived from either side, combined into one list."
      responses:
        "200":
          description: List of whisps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Whisp"
    post:
      operationId: createWhisp
      tags: [whisps]
      summary: Send a new whisp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhispInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whisp"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /whisps/stats:
    get:
      operationId: getWhispStats
      tags: [whisps]
      summary: Dashboard stats for the current user
      responses:
        "200":
          description: Aggregated stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhispStats"

  /whisps/{id}:
    get:
      operationId: getWhisp
      tags: [whisps]
      summary: Get a single whisp with tracking timeline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Whisp detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhispDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteWhisp
      tags: [whisps]
      summary: Delete a whisp
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /whisps/{id}/pin:
    post:
      operationId: pinWhisp
      tags: [whisps]
      summary: Toggle pin for whichever role (sender or matched recipient) the caller has on this whisp
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: New pin state
          content:
            application/json:
              schema:
                type: object
                properties:
                  pinned:
                    type: boolean
                required:
                  - pinned
        "404":
          description: Not found (or the caller has neither role on this whisp)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /whisps/{id}/archive:
    post:
      operationId: archiveWhisp
      tags: [whisps]
      summary: Toggle archive for whichever role the caller has on this whisp — reversible, calling it again un-archives
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: New archive state
          content:
            application/json:
              schema:
                type: object
                properties:
                  archived:
                    type: boolean
                required:
                  - archived
        "404":
          description: Not found (or the caller has neither role on this whisp)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /whisps/{id}/replies:
    get:
      operationId: listWhispReplies
      tags: [whisps]
      summary: Get anonymous replies for a whisp
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Replies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhispReply"
    post:
      operationId: createWhispReply
      tags: [whisps]
      summary: Send an anonymous reply (from recipient or sender follow-up)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhispReplyInput"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhispReply"

  /whisps/{id}/reveal:
    post:
      operationId: requestReveal
      tags: [whisps]
      summary: Sender requests to reveal identity
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reveal requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whisp"
    patch:
      operationId: respondReveal
      tags: [whisps]
      summary: Recipient responds to reveal request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealResponse"
      responses:
        "200":
          description: Reveal response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealResult"
        "400":
          description: No reveal was requested for this whisp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /invites:
    get:
      operationId: listInvites
      tags: [invites]
      summary: List invites sent by the current user
      responses:
        "200":
          description: List of invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
    post:
      operationId: createInvite
      tags: [invites]
      summary: Send an anonymous invite to join Blind Whisper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /invites/claim:
    post:
      operationId: claimInvite
      tags: [invites]
      summary: Attribute the current (just signed-up) account back to the invite that brought them here
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInviteInput"
      responses:
        "200":
          description: Claimed (or a no-op if already claimed or self-invite)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimInviteResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /invites/{id}/reveal:
    post:
      operationId: requestInviteReveal
      tags: [invites]
      summary: Inviter requests to reveal their identity to a joined invitee
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reveal requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          description: This invite hasn't been joined yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: respondInviteReveal
      tags: [invites]
      summary: Invitee responds to reveal request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealResponse"
      responses:
        "200":
          description: Reveal response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealResult"
        "400":
          description: No reveal was requested for this invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/invites/{token}:
    get:
      operationId: getPublicInvite
      tags: [public]
      summary: Public invite landing page data (no auth required)
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public invite data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInvite"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/text-whisps/{token}:
    get:
      operationId: getPublicTextWhisp
      tags: [public]
      summary: Public Text Whisp guest landing page data (no auth required) — view only, marks it read on first view. There is no reply endpoint here; replying requires signing up (see POST /text-whisps/{id}/replies).
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public Text Whisp data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTextWhisp"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /text-whisps:
    get:
      operationId: listTextWhisps
      tags: [textWhisps]
      summary: List the current user's own Text Whisps (sent and received)
      responses:
        "200":
          description: List of Text Whisps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TextWhisp"
    post:
      operationId: createTextWhisp
      tags: [textWhisps]
      summary: Send a new Text Whisp to any phone number — delivered in-app if it matches a known, verified Blind Whisper user, otherwise as a guest link over SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextWhispInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextWhisp"
        "400":
          description: Bad request (invalid phone number, or sending to yourself)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /text-whisps/{id}:
    get:
      operationId: getTextWhisp
      tags: [textWhisps]
      summary: Get a Text Whisp with its replies — sender or recipient only. Marks it read when the recipient opens it.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Text Whisp detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextWhispDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteTextWhisp
      tags: [textWhisps]
      summary: Soft delete a Text Whisp — sender only
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /text-whisps/{id}/replies:
    get:
      operationId: listTextWhispReplies
      tags: [textWhisps]
      summary: Get replies for a Text Whisp — sender or recipient only
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Replies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TextWhispReply"
    post:
      operationId: createTextWhispReply
      tags: [textWhisps]
      summary: Reply to a Text Whisp — from either the sender or the recipient
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextWhispReplyInput"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextWhispReply"

  /text-whisps/{id}/typing:
    post:
      operationId: pingTextWhispTyping
      tags: [textWhisps]
      summary: Signal that the caller is currently typing a reply — sender or recipient only. Purely ephemeral presence (see TextWhisp.otherPartyTyping); no request body.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Recorded
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /text-whisps/{id}/reveal:
    post:
      operationId: requestTextWhispReveal
      tags: [textWhisps]
      summary: Sender requests to reveal their identity — rejected if the recipient hasn't signed up yet (recipientUserId is still null)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reveal requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextWhisp"
        "400":
          description: The recipient hasn't joined yet — there's no registered account to reveal to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /text-whisps/{id}/reveal/respond:
    post:
      operationId: respondTextWhispReveal
      tags: [textWhisps]
      summary: Recipient accepts or declines a reveal request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealResponse"
      responses:
        "200":
          description: Reveal response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealResult"
        "400":
          description: No reveal was requested for this Text Whisp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /video/meta:
    post:
      operationId: scrapeVideoMeta
      tags: [video]
      summary: Scrape video metadata from a URL (YouTube, TikTok, Instagram, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoMetaRequest"
      responses:
        "200":
          description: Video metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoMeta"
        "400":
          description: Could not scrape URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Video is private, restricted, or no longer exists — the recipient wouldn't be able to open it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/w/{token}:
    get:
      operationId: getPublicWhisp
      tags: [public]
      summary: Public recipient landing page data (no auth required)
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
        - in: query
          name: visitorId
          required: false
          schema:
            type: string
          description: >-
            The anonymous, client-generated, localStorage-persisted id this
            device uses for Circle likes/comments — affects whether the
            response's viewerHasLiked, and each comment's viewerReaction/
            isOwnComment, reflect this visitor. Omit for a Whisper Link/
            circle_dm, where it's meaningless.
      responses:
        "200":
          description: Public whisp data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWhisp"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/w/{token}/video-reply-request:
    post:
      operationId: requestVideoReply
      tags: [public]
      summary: Record that the recipient wanted to whisp a video back but couldn't
      description: >-
        Called when an anonymous recipient taps a locked "whisp a video back"
        control, so the sender can be told (on the same deferred schedule as a
        reply notification) that adding credit would unlock it. Always 204 —
        an unknown token gets the same answer as a known one, so this can't be
        used to probe which tokens exist.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Recorded, or intentionally ignored

  /public/w/{token}/track:
    post:
      operationId: trackWhispEvent
      tags: [public]
      summary: Record a tracking event (opened, clicked, watched)
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingEventInput"
      responses:
        "200":
          description: Tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResult"

  /public/w/{token}/reply:
    post:
      operationId: publicReply
      tags: [public]
      summary: Recipient sends an anonymous reply from the landing page
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicReplyInput"
      responses:
        "201":
          description: Reply sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhispReply"

  /public/w/{token}/appreciation:
    post:
      operationId: submitAppreciation
      tags: [public]
      summary: Recipient answers "was this something you needed to hear?"
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppreciationInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppreciationResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/w/{token}/like:
    post:
      operationId: toggleCircleLike
      tags: [public]
      summary: Anonymous, idempotent like toggle — Blind Circle posts only
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visitorId:
                  type: string
              required: [visitorId]
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked:
                    type: boolean
                  likeCount:
                    type: integer
                required: [liked, likeCount]
        "400":
          description: Not a Blind Circle post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/w/{token}/comments:
    post:
      operationId: postCircleComment
      tags: [public]
      summary: Post a public comment on a Blind Circle post
      description: >-
        Anonymous by default, rate-limited to a handful per rolling 24h
        window per visitor (see lib/plans.ts's canPostAnonymousComment) —
        signing in removes the limit entirely, same as the anonymous reply
        cap elsewhere. isPoster on the response is set automatically when the
        caller is signed in and is this whisp's own sender. An anonymous
        handle is assigned automatically on a visitor's first comment in
        this thread (see anonymous_handles.ts). Also accepts
        multipart/form-data with the same fields plus an optional `image`
        file (max 5MB, jpeg/png/webp/gif) — intentionally not modeled here,
        same reasoning as POST /media/upload above: a `format: binary` body
        generates File/Blob-typed Zod schemas that don't compile in
        lib/api-zod's Node-only project. The frontend attaches an image via
        a hand-written multipart fetch to this same URL, mirroring
        lib/uploadMedia.ts.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commentText:
                  type: string
                visitorId:
                  type: string
                parentCommentId:
                  type: ["string", "null"]
              required: [commentText, visitorId]
      responses:
        "201":
          description: Comment posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleComment"
        "400":
          description: Not a Blind Circle post, or invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Anonymous comment limit reached (code "comment_limit_reached")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/w/{token}/comments/{commentId}/reactions:
    post:
      operationId: reactToCircleComment
      tags: [public]
      summary: Like or dislike a Blind Circle comment
      description: Idempotent toggle — reacting with the same reaction again removes it; reacting with the other one switches it.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
        - in: path
          name: commentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visitorId:
                  type: string
                reaction:
                  type: string
                  enum: [like, dislike]
              required: [visitorId, reaction]
      responses:
        "200":
          description: Updated reaction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentReactionResult"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /public/w/{token}/comments/{commentId}/image:
