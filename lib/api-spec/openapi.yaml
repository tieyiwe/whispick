      summary: Follow or unfollow the account behind a public Whisperer handle (signed in)
      description: >-
        Idempotent toggle — following an already-followed handle unfollows
        it. Resolves by whispererHandle, never a raw user id, matching this
        app's anti-enumeration posture everywhere else. Rejects following
        yourself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                handle:
                  type: string
              required: [handle]
      responses:
        "200":
          description: Updated follow state
          content:
            application/json:
              schema:
                type: object
                properties:
                  following:
                    type: boolean
                  followerCount:
                    type: integer
                required: [following, followerCount]
        "400":
          description: Tried to follow yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No account with that handle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

