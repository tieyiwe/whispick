          $ref: "#/components/schemas/AvatarId"
        mfaNudgeDismissedAt:
          type: ["string", "null"]
          description: When this account last dismissed the two-factor setup nudge. Whether 2FA is actually ON is never included here — read Clerk's own user.twoFactorEnabled client-side for that; this is only "did they say not now."
        plan:
          type: string
        boostCredits:
          type: integer
        whisperLinksUsed:
          type: integer
        role:
          type: string
        emailNotificationsEnabled:
          type: boolean
          description: Whether this Whisperer wants the "you have a new whisp" email in addition to the in-app notification. On by default — see PATCH /user/profile to change it.
        showOnlineStatus:
          type: boolean
          description: Whether accounts that follow this Whisperer can see them as online (see GET /follows/online-status). On by default.
        twoFactorEnabled:
          type: ["boolean", "null"]
          description: Best-effort, admin-facing mirror of Clerk's own user.twoFactorEnabled — never used for any access-control decision. Null means never synced yet, distinct from false ("synced, and it's off").
        createdAt:
          type: string
      required:
