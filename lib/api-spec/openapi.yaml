        "409":
          description: Report already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/content-reports/{id}/resolve:
    post:
      operationId: adminResolveContentReport
      tags: [admin]
      summary: Resolve a report — optionally take the content down, always notify the reporter, optionally warn the author (admin only)
      description: >-
        resolution 'removed' sets removedByAdminAt on the reported content
        (excluding it from every public read); 'no_violation' leaves it up.
        Either way the reporter receives an in-app notification — the custom
        replyToReporter message when provided, an honest default for the
        chosen resolution otherwise. warnAuthor, when present, is delivered
        to the content author's account as a Community Guidelines warning;
        authorWarned is false in the response when the author has no account
        to deliver to (anonymous commenter).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveContentReportInput"
      responses:
        "200":
          description: Resolved report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveContentReportResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
