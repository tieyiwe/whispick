kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
# "/wb" is a second, bare top-level prefix (not under "/api") so a shared
# Whisper Box link reads as blindwhisper.com/wb/handle instead of
# blindwhisper.com/api/wb/handle — see routes/whisperBoxLink.ts. It has to
# be this server (not the static-hosted frontend) that owns it: only a
# running Node process can tell a link-preview crawler apart from a real
# browser and return real per-handle Open Graph tags instead of the static
# site's generic ones.
paths = ["/api", "/wb"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
