    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image:alt" content="Blind Whisper — anonymous messages, videos, and notes for the people who need them" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG icons and won't use the one above, falling back to a
         screenshot of the page when someone adds the app to their home screen.
         This PNG is the same mark on a deliberately square background, since
         iOS applies its own corner mask and would otherwise round it twice. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Android's home-screen icon and install metadata come from the manifest,
         not from the icons above. Without it the service worker registered in
         lib/push.ts had nothing to install against, and "Add to Home Screen"
         fell back to a screenshot the same way iOS did. The maskable icon is a
         separate file because Android masks icons to arbitrary shapes and keeps
         only the central 80% circle, which the full-size mark overflows. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Blind Whisper",
        "alternateName": "BlindWhisper",
        "url": "https://blindwhisper.com/",
        "inLanguage": "en",
        "publisher": {
          "@type": "Organization",
          "name": "TIBLOGICS"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Blind Whisper",
        "url": "https://blindwhisper.com/",
        "description": "Blind Whisper lets you send a video or a short written note to someone who needs it, anonymously — without revealing who you are unless you choose to.",
        "applicationCategory": "SocialNetworkingApplication",
        "operatingSystem": "Any",
        "image": "https://blindwhisper.com/opengraph.jpg",
        "featureList": [
          "Whisper Link — anonymous one-to-one video delivery by email, SMS, or WhatsApp",
          "Text Whisp — short anonymous written messages to any phone number",
          "Whisper Groups — one anonymous video sent to several saved recipients",
          "Blind Circle — anonymous community video feed",
          "Reveal Flow — consent-based identity reveal the recipient can accept or decline",
          "Anonymous replies — recipients can respond without either side being identified",
          "Scheduled sending — pick a future date and time for delivery"
        ],
        "offers": {
          "@type": "AggregateOffer",

          "name": "TIBLOGICS",

            "name": "TILO GROUP, LLC"

        }
      }
    </script>
    <script type="application/ld+json">

    </script>
    <!-- FAQPage JSON-LD is injected here at build time by scripts/prerender.mjs,
         generated from src/lib/faqContent.ts so the structured data always
         matches the FAQ accordion's visible text exactly. -->
    <!-- PRERENDER:FAQ_JSONLD -->
